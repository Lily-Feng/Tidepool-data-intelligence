# Tidy (support/) checks: offline tests, portability rules, privacy scan.
# No cloud credentials: CI never calls GCP or a live model.
name: Tidy CI

on:
  pull_request:
    paths: ["support/**", "tests/support/**", ".github/workflows/support-ci.yml"]
  push:
    branches: [GCP_full-stack]
    paths: ["support/**", "tests/support/**", ".github/workflows/support-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: support/requirements*.txt
      - run: pip install -r support/requirements-dev.txt
      - name: Tests (includes portability rules)
        run: python -m pytest tests/support -q
      - name: Privacy scan of changed lines
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$(git rev-list --max-parents=0 HEAD)"
          patterns='twiist_[0-9]{6,}|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|dapi[0-9a-f]{32}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git diff "$base" HEAD -U0 -- support tests/support | grep -E '^\+' | grep -nE "$patterns"; then
            echo "::error::identifier or secret pattern in diff"; exit 1
          fi
          if git diff --name-only "$base" HEAD | grep -E '^(private|data)/'; then
            echo "::error::private/ or data/ path in diff"; exit 1
          fi
